<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>STYLE TERMINAL WAOUH</title>
    <style>
        /* --- NOUVEL EFFET VISUEL : NEURAL BACKGROUND --- */
        #neural-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: -1;
            background: radial-gradient(circle at center, #002006 0%, #80ff00 100%);
        }

        
        
        
      
    </style>
</head>
<body>
    
    <canvas id="neural-canvas"></canvas>

    
  

    <script>
        // --- ANIMATION BACKGROUND : NEURAL RAIN ---
        const canvas = document.getElementById('neural-canvas');
        const ctx = canvas.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const columns = Math.floor(canvas.width / 20);
        const drops = new Array(columns).fill(1);





        //-------------------------------------------------------code javascript lettre qui tombe whaou------------------------
        function drawNeural() {
            ctx.fillStyle = 'rgba(5, 5, 5, 0.1)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.font = '15px monospace';
            
            for (let i = 0; i < drops.length; i++) {
                const text = Math.random() > 0.5 ? "0" : "1";
                ctx.fillStyle = Math.random() > 0.8 ? "#0cff00" : "#01900f";
                
                ctx.fillText(text, i * 20, drops[i] * 20);

                if (drops[i] * 20 > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
        }
        //-------------------------------------------------------------------------------






        setInterval(drawNeural, 50);        //appel de la fonction (+ grand -> plus lent. + petit -> plus rapide)

        


        

       

        
       
    </script>
<button type="button" class="btn">Base class</button><button type="button" class="btn">Minecraft</button>
</body>
