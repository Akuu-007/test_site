<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>S01E01 - L'INTRUSION</title>
    <style>
        
        :root {
            --neon-green: #00ff41;
            --alert-red: #ff3333;
            --bg-dark: #020502;
        }

        /* --- ARRIÈRE-PLAN VISIBLE ET DYNAMIQUE --- */
        body {
            background-color: var(--bg-dark);
            color: var(--neon-green);
            font-family: 'Courier New', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px;
            margin: 0;
            overflow-x: hidden;
            min-height: 100vh;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(
                rgba(18, 16, 16, 0) 50%,
                rgba(0, 255, 65, 0.1) 50%
            ), linear-gradient(90deg, rgba(255, 0, 0, 0.05), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.05));
            background-size: 100% 4px, 100% 100%;
            z-index: 5;
            pointer-events: none;
        }

        .scanline {
            width: 100%;
            height: 100px;
            z-index: 6;
            background: linear-gradient(0deg, rgba(0, 255, 65, 0) 0%, rgba(0, 255, 64, 0.2) 50%, rgba(0, 255, 65, 0) 100%);
            opacity: 0.1;
            position: absolute;
            bottom: 100%;
            animation: scan 3s linear infinite;
        }

        @keyframes scan {
            5% { bottom: 100%; }
            100% { bottom: -10%; }
        }

        .glitch-bar {
            position: fixed;
            left: 0; width: 100%; height: 3px;
            background: rgba(0, 255, 65, 0.4);
            z-index: 1001;
            pointer-events: none;
            animation: glitch-lines 2s linear infinite;
        }

        @keyframes glitch-lines {
            0% { top: -10%; }
            10% { top: 30%; height: 10px; opacity: 0.8; }
            11% { top: -10%; }
            100% { top: 110%; }
        }
 
        
    </style>
</head>
<body>
    
    <div class="scanline"></div>
    <div class="glitch-bar" style="animation-delay: 0.5s;"></div>

    
</body>
</html>
